# Bitbucket Pipelines template for Agronomist.
#
# Required repository/workspace variables:
# - BITBUCKET_TOKEN: secured token used for API calls and pushes.
# - BITBUCKET_WORKSPACE: Bitbucket workspace slug. Bitbucket provides this automatically.
# - BITBUCKET_REPO_SLUG: repository slug. Bitbucket provides this automatically.
#
# Optional variables:
# - AGRONOMIST_VERSION: package version to install. Default: latest available from PyPI.
# - AGRONOMIST_ROOT: root directory to scan. Default: .
# - AGRONOMIST_RESOLVER: resolver strategy. Default: auto.
# - AGRONOMIST_CONFIG: config path. Default: .agronomist.yaml.
# - PR_BODY: pull request description. Default: Updates generated by Agronomist.
# - PR_TARGET_BRANCH: destination branch. Default: repository main branch.

image: python:3.12-slim

pipelines:
  default:
    - step:
        name: Agronomist smoke
        script:
          - python --version

  custom:
    agronomist-update:
      - step:
          name: Run Agronomist update
          caches:
            - pip
          script:
            - apt-get update -qq && apt-get install -y -qq git curl jq ca-certificates
            - |
              if [ -n "${AGRONOMIST_VERSION:-}" ]; then
                pip install -q "agronomist==${AGRONOMIST_VERSION#v}"
              else
                pip install -q agronomist
              fi
            - git config user.name "agronomist-bot"
            - git config user.email "agronomist@bot.local"
            - |
              if [ -n "${BITBUCKET_TOKEN:-}" ]; then
                git config --global credential.helper store
                printf 'https://x-token-auth:%s@bitbucket.org\n' "$BITBUCKET_TOKEN" > ~/.git-credentials
                git config --global url."https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/".insteadOf "https://bitbucket.org/"
              fi
            - |
              TOKEN_ARG=""
              if [ -n "${BITBUCKET_TOKEN:-}" ]; then
                TOKEN_ARG="--bitbucket-token ${BITBUCKET_TOKEN}"
              fi
              agronomist update \
                --root "${AGRONOMIST_ROOT:-.}" \
                --resolver "${AGRONOMIST_RESOLVER:-auto}" \
                --config "${AGRONOMIST_CONFIG:-.agronomist.yaml}" \
                --json report.json \
                $TOKEN_ARG
            - bash examples/bitbucket/create_pr.sh

# To run weekly, create a Bitbucket schedule that triggers the custom
# pipeline named "agronomist-update" from Repository settings > Pipelines > Schedules.
# Conceptual schedule example (configured in the Bitbucket UI, not in YAML):
# schedules:
#   - cron: "0 6 * * 1"
#     branch: main
#     custom_pipeline: agronomist-update
